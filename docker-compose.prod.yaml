services:
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APACHE_CONF: ${APACHE_CONF}
        APP_ENV: ${APP_ENV}
    container_name: videgrenier-web-${APP_ENV}
    ports:
      - "${APP_PORT}:${CONTAINER_APP_PORT}"
    
    depends_on:
      - db-prod
    env_file:
      - ./.env.prod

  db-prod:
    image: mysql:8
    container_name: videgrenier-db-${APP_ENV}
    restart: always
    ports:
      - "${DB_PORT}:${CONTAINER_DB_PORT}"
    env_file:
      - ./.env.prod
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql

volumes:
  db_data_prod:
