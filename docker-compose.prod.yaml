services:
  web-prod:
    build:
      context: . # Le contexte de construction est le répertoire courant
      dockerfile: Dockerfile # Spécifie le Dockerfile à utiliser pour la construction
      args:
        APACHE_CONF: ${APACHE_CONF} # Passe la configuration Apache en tant qu'argument de construction
        APP_ENV: ${APP_ENV} # Passe l'environnement de l'application en tant qu'argument de construction
    container_name: videgrenier-web-${APP_ENV} # Définit le nom du conteneur
    ports:
      - "${APP_PORT}:80" # Mappe le port de l'application
    depends_on:
      - db-prod # Indique que ce service dépend du service db-prod
    env_file:
      - ./.env.prod # Charge les variables d'environnement depuis le fichier .env.prod

  db-prod:
    image: mysql:8 # Utilise l'image MySQL version 8
    container_name: videgrenier-db-${APP_ENV} # Définit le nom du conteneur
    restart: always # Redémarre toujours le conteneur s'il s'arrête
    ports:
      - "${DB_PORT}:3306" # Mappe le port de la base de données
    env_file:
      - ./.env.prod # Charge les variables d'environnement depuis le fichier .env.prod
    # Les volumes ne sont pas montés en production comme demandé
    # volumes:
    #  - db_data_prod:/var/lib/mysql
    #  - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql

volumes:
  db_data_prod: # Définit un volume nommé pour les données de la base de données
